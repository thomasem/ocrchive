[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrchive"
version = "0.0.1"
license = "GPL-3.0" 
keywords = ["ocr", "ocrchive", "documents", "search"]

[project.optional-dependencies]
api = [
    "aiofiles==24.1.0",
    "fastapi[standard]==0.115.12",
    "pydantic==2.11.5",
    "pydantic-settings==2.9.1"
]

[project.urls]
Repository = "https://github.com/thomasem/ocrchive"

[tool.pyright]
venvPath='.'
venv="venv"
exclude=['venv']
